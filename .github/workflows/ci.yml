name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Build (Apple)
    # Zulu's deployment target is iOS 27, so it needs the Xcode 27 image. That image
    # is in public preview and arm64-only.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build ZuluKit
        working-directory: Packages/ZuluKit
        run: swift build

      - name: Build app
        working-directory: App
        run: |
          xcodegen generate
          xcodebuild build \
            -project Zulu.xcodeproj \
            -scheme Zulu \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build nav-shell prototype
        working-directory: prototypes/nav-shell
        run: |
          xcodegen generate
          xcodebuild build \
            -project NavShell.xcodeproj \
            -scheme NavShell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
