name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Build (Apple)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      # Placeholder target until the real app and its packages land. Each prototype
      # that still builds is a prototype that can still be reacted to.
      - name: Build nav-shell prototype
        working-directory: prototypes/nav-shell
        run: |
          xcodegen generate
          xcodebuild build \
            -project NavShell.xcodeproj \
            -scheme NavShell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
