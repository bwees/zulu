name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Build (Apple)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Zulu's deployment target is iOS 27, but GitHub-hosted runners ship no Xcode
      # newer than 26.x, so CI compiles against an older SDK than a developer does.
      # Anything genuinely iOS 27-only will fail here while succeeding locally.
      # Printing the toolchain keeps that gap visible instead of surprising someone.
      - name: Show available toolchains
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      # Placeholder target until the real app and its packages land. Each prototype
      # that still builds is a prototype that can still be reacted to.
      - name: Build nav-shell prototype
        working-directory: prototypes/nav-shell
        run: |
          xcodegen generate
          xcodebuild build \
            -project NavShell.xcodeproj \
            -scheme NavShell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
