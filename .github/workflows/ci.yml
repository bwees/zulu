name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Build (Apple)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Zulu targets iOS 27. A runner without the iOS 27 SDK will still build a
      # deployment-target-27 project against an older SDK and miss every API that
      # does not exist yet, so the toolchain is printed rather than assumed.
      - name: Show available toolchains
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      # Placeholder target until the real app and its packages land. Each prototype
      # that still builds is a prototype that can still be reacted to.
      - name: Build nav-shell prototype
        working-directory: prototypes/nav-shell
        run: |
          xcodegen generate
          xcodebuild build \
            -project NavShell.xcodeproj \
            -scheme NavShell \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
