name: Release

on:
  push:
    branches: [main]

# Two uploads racing would fight over the same build number, so releases queue
# rather than cancel each other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Team IDs are not secret; they appear in every shipped binary.
  APPLE_TEAM_ID: 65AMD2STXG

jobs:
  testflight:
    name: TestFlight
    # Same image as ci.yml: iOS 27 deployment target needs the Xcode 27 runner.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Test ZuluKit
        working-directory: Packages/ZuluKit
        run: swift test

      - name: Derive build number
        id: build-number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # One .p12 holds both the development and the distribution identity. xcodebuild
      # archive signs for development and -exportArchive re-signs for distribution,
      # so a runner with only the distribution certificate cannot get past archiving.
      - name: Import signing certificates
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_SIGNING_CERTIFICATES_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/zulu-signing.keychain-db"
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          p12="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$p12"

          # Without this codesign stops to ask for keychain access and the run hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" > /dev/null

          # Prepend rather than replace, so the runner's login keychain still resolves.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # altool only looks in a handful of fixed directories; this is one of them.
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          key="$dir/AuthKey_$API_KEY_ID.p8"
          echo "$API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: App
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.build-number.outputs.value }}
        run: |
          set -euo pipefail
          xcodegen generate
          # DEVELOPMENT_TEAM lives here and not in project.yml: a team in project.yml
          # would also apply to the simulator build, whose keychain items were written
          # under the untethered access group. CODE_SIGN_IDENTITY is not set alongside
          # it — automatic signing rejects a manually chosen identity outright.
          xcodebuild archive \
            -project Zulu.xcodeproj \
            -scheme Zulu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Zulu.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export signed ipa
        working-directory: App
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Zulu.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Zulu.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_KEY_ISSUER_ID"

      - name: Keep the ipa and symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zulu-${{ steps.build-number.outputs.value }}
          path: |
            ${{ runner.temp }}/export/Zulu.ipa
            ${{ runner.temp }}/Zulu.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
