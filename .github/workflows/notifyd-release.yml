name: Notification service release

# release-please.yml calls this when it cuts a notifyd release.
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v, e.g. 0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish zulu-notifyd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The v prefix is the tag shape Renovate tracks in the homelab.
      - uses: docker/build-push-action@v6
        with:
          context: service
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/zulu-notifyd:v${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
