name: Zulu
options:
  bundleIdPrefix: com.bwees
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  ZuluKit:
    path: ../Packages/ZuluKit
targets:
  Zulu:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ZuluKit
        product: ZulipAPI
      - package: ZuluKit
        product: ZuluStore
      - package: ZuluKit
        product: ZuluSync
      - package: ZuluKit
        product: ZuluMarkup
      - package: ZuluKit
        product: ZuluEmoji
      - package: ZuluKit
        product: ZuluCompose
      - package: ZuluKit
        product: ZuluPolls
    info:
      path: Zulu-Info.plist
      properties:
        CFBundleDisplayName: Zulu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Without this, every TestFlight build sits at "Missing Compliance" until a
        # human answers the export questionnaire in App Store Connect. Zulu only
        # speaks HTTPS to a Zulip server, which is exempt.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Zulip server hardcodes a zulip:// redirect for the SSO flow, so the
        # scheme is not ours to choose.
        CFBundleURLTypes:
          - CFBundleURLName: com.bwees.zulu
            CFBundleURLSchemes: [zulip]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bwees.zulu
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Bumped by hand when we decide a release is worth a new number.
        MARKETING_VERSION: "1.0"
        # Placeholder only. The release workflow overrides this on the xcodebuild
        # command line with the commit count, so the checked-in value never reaches
        # App Store Connect.
        CURRENT_PROJECT_VERSION: "1"
        # DEVELOPMENT_TEAM and CODE_SIGN_STYLE are deliberately absent. A team here
        # gives the app a real application-identifier, which moves its default
        # keychain access group and hides the API key AccountStorage already wrote.
        # Signing settings are passed to the release archive by xcodebuild instead.
